apiVersion: v1
kind: ConfigMap
metadata:
  name: ros-zenoh-config
  labels:
    app: ros-zenoh-config
data:
  # Router config: loaded by the zenoh-router pod via --config /config/router.json5
  router.json5: |
    {
      mode: "router",
      listen: {
        endpoints: ["tcp/0.0.0.0:7447"]
      },
      plugins_loading: {
        enabled: true
      },
      plugins: {
        rest: {
          http_port: "0.0.0.0:8000"
        },
        remote_api: {
          websocket_port: "0.0.0.0:10000"
        }
      }
    }
