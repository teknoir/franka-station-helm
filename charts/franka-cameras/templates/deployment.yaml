apiVersion: apps/v1
kind: Deployment
metadata:
  name: cameras
  labels:
    app: cameras
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cameras
  template:
    metadata:
      labels:
        app: cameras
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {{ toYaml ( .Values.global.nodeSelector | default .Values.nodeSelector ) | nindent 8 }}
      imagePullSecrets:
        - name: persona-harbor-pullsecret
      containers:
        - name: cameras
          image: {{ .Values.global.image | default .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - -ic
          args:
            - |
              sudo apt-get install -y --no-install-recommends ros-${ROS_DISTRO}-rmw-zenoh-cpp
              source /opt/persona/manipulation/setup.bash
              ros2 launch persona_robot_station station_cameras.launch.py station_name:={{ .Values.global.robot | default .Values.robot }}
          securityContext:
            privileged: true
            capabilities:
              add:
                - SYS_NICE
                - IPC_LOCK
          env:
            - name: ROS_DOMAIN_ID
              value: "4404"
            - name: ROS_LOCALHOST_ONLY
              value: "0"
            - name: RMW_IMPLEMENTATION
              value: "rmw_zenoh_cpp"
            - name: ZENOH_CONFIG_OVERRIDE
              value: "connect/endpoints=[\"tcp/ros-zenoh-router:7447\"]"
            - name: ZENOH_ROUTER_CHECK_ATTEMPTS
              value: "0"
          resources: {}
          volumeMounts:
            - mountPath: /home/persona/ws_colcon/src/manipulation
              name: manipulation-src
            - mountPath: /dev/bus/usb
              name: dev-bus-usb
      volumes:
        - hostPath:
            path: /home/persona/persona
            type: DirectoryOrCreate
          name: manipulation-src
        - hostPath:
            path: /dev/bus/usb
            type: Directory
          name: dev-bus-usb