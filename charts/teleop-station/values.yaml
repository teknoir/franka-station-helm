# franka-station values
# Kept minimal for GitOps — most configuration lives directly in templates.
# Override here only for environment-specific differences.

# Node where ROS talker/listener pods run
nodeSelector:
  kubernetes.io/hostname: teknoir-master

# Station name (e.g., castor, pollux)
stationName: castor

# ROS manipulation image
image: "persona-nas1.chipmunk-tuna.ts.net/persona/manipulation:jazzy-py3.12-dev-ubuntu24.04"
