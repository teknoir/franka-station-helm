---
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: castor
  namespace: default
spec:
  repo: https://teknoir.github.io/franka-station-helm
  chart: franka-station
  targetNamespace: default
  valuesContent: |-
    global:
      robot: castor
      nodeSelector:
        kubernetes.io/hostname: teknoir-master
      image: "persona-nas1.chipmunk-tuna.ts.net/persona/manipulation:jazzy-py3.12-dev-ubuntu24.04"
    
    franka-cameras:
      nodeSelector:
        kubernetes.io/hostname: teknoir-master

    franka-pcf:
      nodeSelector:
        kubernetes.io/hostname: teknoir-master

    franka-ros:
      nodeSelector:
        kubernetes.io/hostname: teknoir-master

    franka-zenoh-router:
      nodeSelector:
        kubernetes.io/hostname: teknoir-master
      image: "ghcr.io/teknoir/ros-helm/zenoh-router:latest"
